name: Cópia diária dos dados (backup)

# Todo dia às 03:17 (Brasília): acessa o Supabase (o que também mantém o projeto gratuito ativo),
# copia as tabelas do diário, a auditoria e os logins, criptografa com senha e guarda por 90 dias.
# Aos domingos (ou quando pedido em "Run workflow") também copia os arquivos das fotos, numa cópia separada
# guardada por 14 dias (são grandes; duas semanas de cópias bastam para recuperar um arquivo perdido).
# Segredos necessários (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_SERVICE_KEY  chave secreta do Supabase (Project Settings → API Keys → Secret keys)
#   BACKUP_SENHA          senha para abrir as cópias (guarde-a fora do GitHub)
# O repositório é público: a cópia só sai daqui criptografada e o log mostra apenas contagens.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fotos:
        description: 'Copiar também os arquivos das fotos'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # para manter esta tarefa ativa (o GitHub desliga agendamentos após 60 dias sem atividade)

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://euopzdxtwtwvsjmdemno.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
    steps:
      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ] || [ -z "$BACKUP_SENHA" ]; then
            echo "::error::Cadastre os segredos SUPABASE_SERVICE_KEY e BACKUP_SENHA (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ ${#BACKUP_SENHA} -lt 12 ]; then echo "::error::BACKUP_SENHA precisa de pelo menos 12 caracteres."; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Versão fixa e conferida pelo package-lock: esta tarefa roda com a chave secreta do Supabase.
      - name: Instalar só o cliente do Supabase
        run: npm ci --prefix scripts/backup --no-audit --no-fund --ignore-scripts >/dev/null
      - name: Testar o script de cópia
        run: node --test scripts/backup/backup.test.mjs
      - name: Copiar os dados
        run: node scripts/backup/backup.mjs backup
      - name: Compactar e criptografar
        run: |
          DATA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          tar czf rdo.tar.gz backup
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in rdo.tar.gz -out "rdo-backup-$DATA.tar.gz.enc" -pass env:BACKUP_SENHA
          rm -rf backup rdo.tar.gz
          ls -lh "rdo-backup-$DATA.tar.gz.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: rdo-backup-${{ env.DATA }}
          path: rdo-backup-*.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
      - name: Decidir se copia as fotos (domingo ou quando pedido)
        id: fotos
        env:
          PEDIDO: ${{ github.event.inputs.fotos }}
        run: |
          if [ "$PEDIDO" = "true" ] || [ "$(TZ=America/Sao_Paulo date +%u)" = "7" ]; then echo "copiar=sim" >> "$GITHUB_OUTPUT"; fi
      - name: Copiar e criptografar as fotos
        if: steps.fotos.outputs.copiar == 'sim'
        run: |
          node scripts/backup/backup.mjs fotos fotos
          tar czf fotos.tar.gz fotos
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in fotos.tar.gz -out "rdo-fotos-$DATA.tar.gz.enc" -pass env:BACKUP_SENHA
          rm -rf fotos fotos.tar.gz
          ls -lh "rdo-fotos-$DATA.tar.gz.enc"
      - uses: actions/upload-artifact@v4
        if: steps.fotos.outputs.copiar == 'sim'
        with:
          name: rdo-fotos-${{ env.DATA }}
          path: rdo-fotos-*.tar.gz.enc
          retention-days: 14
          if-no-files-found: error
      - name: Manter o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable" || true
